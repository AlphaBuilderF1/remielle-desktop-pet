name: 功能建议
description: 提出新功能、交互或体验改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量从使用场景和要解决的问题出发，不必先设计完整技术方案。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你会在什么情况下使用这项功能？
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 当前体验有什么不便，或缺少什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望看到的行为或交互。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 可选。如果你考虑过其他方式，可以在这里说明。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选。可附上已脱敏的示意图或参考链接。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issues，没有找到相同建议。
          required: true
        - label: 我提交的内容不包含 API 密钥、私人对话或其他敏感信息。
          required: true
