name: Bug 报告
description: 报告可稳定复现的错误或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进蕾米埃尔桌宠。提交前请先搜索已有 Issues，避免重复报告。

        > **隐私提醒：**请勿粘贴 API 密钥、`config.json`、`memory.json`、私人对话或未脱敏的日志。

  - type: input
    id: app_version
    attributes:
      label: 软件版本
      description: 可在 Release 文件名或下载页查看。
      placeholder: 例如 v0.3.0
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: run_mode
    attributes:
      label: 运行方式
      options:
        - GitHub Release 便携版
        - 从源码运行
        - 其他
    validations:
      required: true

  - type: dropdown
    id: ai_enabled
    attributes:
      label: 发生问题时是否启用 AI
      options:
        - 未启用 AI
        - 已启用 AI
        - 不确定或与 AI 无关
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简洁说明发生了什么。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请从启动程序开始，按顺序列出操作。
      placeholder: |
        1. 启动桌宠
        2. 右键选择……
        3. 点击……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的错误信息
      description: 可选。请在粘贴前删除用户名、路径、密钥、对话和其他私密信息。
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充信息
      description: 可选。可将已脱敏截图拖入此处。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issues，没有找到相同问题。
          required: true
        - label: 我已检查内容，未包含 API 密钥、配置文件、私人对话或其他敏感信息。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
